trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  jobs:
  - job: Build
    steps:
    - task: TerraformInstaller@0
      inputs:
        terraformVersion: '1.5.0'
    - script: |
        terraform init
        terraform validate
    - script: |
        terraform plan
    - script: |
        terraform apply -auto-approve

- stage: Test
  jobs:
  - job: Test
    steps:
    - script: |
        echo "Executing tests"

- stage: Scan
  jobs:
  - job: DependencyScan
    steps:
    - script: |
        echo "Scanning dependencies with Trivy"
  - job: ImageScan
    steps:
    - script: |
        echo "Scanning images with Trivy"

- stage: Deploy
  jobs:
  - job: Deploy
    steps:
    - script: |
        echo "Deploying the infrastructure"